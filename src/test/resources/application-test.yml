# ============================================================
# Before You Go — Test Configuration
# Uses H2 in-memory database for fast unit/integration tests.
# ============================================================

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  flyway:
    enabled: false

server:
  port: 0

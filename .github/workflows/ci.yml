# ============================================================
# CI — Before You Go
# Runs on every push and pull request.
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        run: ./mvnw verify -B

      - name: Check no secrets in repo
        run: |
          # Fail if a real .env file is committed
          if [ -f .env ]; then
            echo "ERROR: .env file found in repository! Secrets must not be committed."
            exit 1
          fi
